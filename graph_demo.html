<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/graphology@0.25.1/dist/graphology.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sigma@2.4.0/build/sigma.min.js"></script>

    <script src="https://unpkg.com/graphology-layout-force@0.6.1/build/graphology-layout-force.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/graphology-layout@0.17.2/build/graphology-layout.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;

        .header {
            background: white;
            padding: 20px;

        }

        .graph-container {
            background: white;

        }

        #graph {
            width: 100%;
            height: 100%;

        }

        .controls {
            position: absolute;

        .control-group {
            margin-bottom: 10px;

        .control-group label {
            display: block;

        button {
            background: #007bff;

        .info {
            position: absolute;
            bottom: 20px;

            position: absolute;
            bottom: 20px;

<body>
    <div class="container">
        <div class="header">
            <h1>Knowledge Graph Visualization</h1>
            <p>Interactive graph visualization using Sigma.js</p>
        </div>

        <div class="graph-container">
            <div id="graph"></div>

            <div class="loading-overlay" id="loading-overlay">
                <div class="loading-content">
                    <div class="spinner"></div>
                    <h3 id="loading-title">Applying Layout...</h3>
                    <p id="loading-status">Initializing...</p>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label>View Controls</label>
                    <button onclick="resetCamera()">Reset View</button>
                    <button onclick="stopLayout()" id="stop-layout-btn">Stop Layout</button>
                </div>
                <div class="control-group">
                    <label>Layout Algorithms</label>
                    <button onclick="applyForceDirected()">Force Directed</button>
                    <button onclick="applyCircularLayout()">Circular</button>
                    <button onclick="applyForceAtlas2()" id="forceatlas2-btn" style="display: none;">ForceAtlas2</button>
                </div>
                <div class="control-group">
                    <label>Node Filters</label>
                    <button onclick="filterByType('entity')">Entities Only</button>
                    <button onclick="filterByType('document')">Documents Only</button>
                    <button onclick="showAll()">Show All</button>
                </div>
            </div>

            <div class="info">
                <div id="node-info">Hover over a node to see details</div>
            </div>

            <div class="legend">
                <h4 style="margin-top: 0;">Legend</h4>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #e74c3c;"></div>
                    <span>Entity</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #3498db;"></div>
                    <span>Document</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let graph;
        let renderer;
        let layoutRunning = false;
        let layoutWorker = null;
        let originalData;
        let currentLayoutAnimation = null;

        // Color mapping for different node types
        const nodeColors = {
            'entity': '#e74c3c',
            'document': '#3498db'
        };

        // Entity type colors for more detailed visualization
        const entityColors = {
            'PERSON': '#e67e22',
            'LOCATION': '#27ae60',
            'DATETIME': '#8e44ad',
            'PROPER_NOUN': '#f39c12',
            'NUMERIC': '#16a085',
            'NORP': '#e91e63',
            '': '#95a5a6'  // default for empty entity types
        };

        async function loadGraph() {
            try {
                                // Check if libraries are loaded
                if (typeof graphology === 'undefined') {
                    throw new Error('Graphology library not loaded');
                }
                if (typeof Sigma === 'undefined') {
                    throw new Error('Sigma.js library not loaded');
                }

                console.log('Libraries loaded successfully');
                console.log('Graphology:', typeof graphology);
                console.log('Sigma:', typeof Sigma);
                console.log('ForceAtlas2:', typeof graphologyLayoutForceAtlas2);
                console.log('Force Layout:', typeof graphologyLayoutForce);

                const response = await fetch('data/example_graph_dvs.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                originalData = data;

                // Convert the data format to Sigma.js format
                const sigmaData = convertToSigmaFormat(data);

                // Create the graph
                graph = new graphology.Graph();

                // Add nodes
                sigmaData.nodes.forEach(node => {
                    graph.addNode(node.id, node);
                });

                // Add edges
                sigmaData.edges.forEach(edge => {
                    if (graph.hasNode(edge.source) && graph.hasNode(edge.target)) {
                        graph.addEdge(edge.source, edge.target, edge);
                    }
                });

                // Apply layout
                applyLayout();

                // Create renderer
                renderer = new Sigma(graph, document.getElementById('graph'));

                // Add event listeners
                setupEventListeners();

                console.log(`Graph loaded successfully: ${graph.nodes().length} nodes, ${graph.edges().length} edges`);

            } catch (error) {
                console.error('Error loading graph:', error);
                document.getElementById('graph').innerHTML =
                    `<div class="error">Error loading graph: ${error.message}</div>`;
            }
        }

        function convertToSigmaFormat(data) {
            const nodes = data.nodes.map((node, index) => {
                // Determine color based on node kind and entity type
                let color = nodeColors[node.kind] || '#95a5a6';
                if (node.kind === 'entity' && node.entity) {
                    color = entityColors[node.entity] || entityColors[''];
                }

                return {
                    id: node.node_id || node.id,
                    label: node.label,
                    size: node.kind === 'document' ? 8 : 5,
                    color: color,
                    kind: node.kind,
                    entity: node.entity,
                    x: (Math.random() - 0.5) * 800,
                    y: (Math.random() - 0.5) * 800
                };
            });

            const edges = data.edges.map(edge => ({
                id: edge.edge_id,
                source: edge.source,
                target: edge.target,
                label: edge.relation,
                color: '#95a5a6',
                size: 0.8
            }));

            return { nodes, edges };
        }

                function applyLayout() {
            // Start with random positions, no initial layout
            console.log('Graph initialized with random positions');
        }

                // Main Force-Directed Layout - Enhanced version of SimpleForce
        function applyForceDirected() {
            if (!graph || layoutRunning) return;

            stopLayout();
            showLoadingOverlay('Force Directed Layout', 'Calculating optimal positions...');
            console.log('Applying Enhanced Force Directed layout...');

            applyEnhancedForceLayout();
        }

        function applyForceAtlas2() {
            if (!graph || layoutRunning) return;

            stopLayout();
            showLoadingOverlay('ForceAtlas2 Layout', 'Optimizing node positions...');
            console.log('Applying ForceAtlas2 layout...');

            try {
                layoutRunning = true;

                // Increased iterations for large graphs
                const totalIterations = Math.min(50, Math.max(20, Math.ceil(graph.nodes().length / 20)));

                const settings = {
                    iterations: totalIterations,
                    settings: {
                        gravity: 0.1, // Reduced gravity for more spread
                        scalingRatio: 4.0, // Increased scaling for larger distances
                        strongGravityMode: false,
                        barnesHutOptimize: true,
                        barnesHutTheta: 2.0, // Increased theta for better performance with large graphs
                        slowDown: 5, // Increased slowdown for more stable layout
                        linLogMode: false,
                        outboundAttractionDistribution: false,
                        adjustSizes: false,
                        edgeWeightInfluence: 0.5 // Reduced edge influence for more spread
                    }
                };

                if (typeof graphologyLayoutForceAtlas2 !== 'undefined') {
                    // Run async with progress updates
                    runForceAtlas2Async(settings, totalIterations);
                } else {
                    console.warn('ForceAtlas2 not available, using enhanced force layout');
                    hideLoadingOverlay();
                    applyEnhancedForceLayout();
                }

            } catch (error) {
                console.error('Error applying ForceAtlas2:', error);
                hideLoadingOverlay();
                applyEnhancedForceLayout(); // Fallback
            }
        }

        function runForceAtlas2Async(settings, totalIterations) {
            let currentIteration = 0;
            const batchSize = 5; // Process 5 iterations at a time

            function processBatch() {
                if (currentIteration >= totalIterations || !layoutRunning) {
                    layoutRunning = false;
                    hideLoadingOverlay();
                    if (renderer) renderer.refresh();
                    console.log('ForceAtlas2 layout completed successfully');
                    return;
                }

                // Update progress
                const progress = (currentIteration / totalIterations) * 100;
                updateProgress(progress, `Iteration ${currentIteration}/${totalIterations}`);

                // Run a batch of iterations
                const batchSettings = {
                    ...settings,
                    iterations: Math.min(batchSize, totalIterations - currentIteration)
                };

                try {
                    graphologyLayoutForceAtlas2.assign(graph, batchSettings);
                    if (renderer) renderer.refresh();
                    currentIteration += batchSettings.iterations;
                } catch (error) {
                    console.error('Error in ForceAtlas2 batch:', error);
                    layoutRunning = false;
                    hideLoadingOverlay();
                    return;
                }

                // Schedule next batch
                currentLayoutAnimation = requestAnimationFrame(processBatch);
            }

            processBatch();
        }

                // Force Layout functions removed - only ForceAtlas2 and Circular layouts available

        function applyCircularLayout() {
            if (!graph) return;

            stopLayout();
            console.log('Applying Circular layout...');

            const nodes = graph.nodes();
            const nodeCount = nodes.length;
            const radius = Math.min(1500, Math.max(600, nodeCount * 15));

            // Separate entities and documents for better visualization
            const entities = [];
            const documents = [];

            nodes.forEach(node => {
                const attributes = graph.getNodeAttributes(node);
                if (attributes.kind === 'document') {
                    documents.push(node);
                } else {
                    entities.push(node);
                }
            });

            // Place documents in outer ring
            documents.forEach((node, index) => {
                const angle = (index * 2 * Math.PI) / documents.length;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                graph.setNodeAttribute(node, 'x', x);
                graph.setNodeAttribute(node, 'y', y);
            });

            // Place entities in inner rings by type
            const entityTypes = {};
            entities.forEach(node => {
                const attributes = graph.getNodeAttributes(node);
                const type = attributes.entity || 'OTHER';
                if (!entityTypes[type]) entityTypes[type] = [];
                entityTypes[type].push(node);
            });

            let ringIndex = 0;
            Object.keys(entityTypes).forEach(type => {
                const typeNodes = entityTypes[type];
                const typeRadius = radius * (0.4 + (ringIndex * 0.25));

                typeNodes.forEach((node, index) => {
                    const angle = (index * 2 * Math.PI) / typeNodes.length;
                    const x = Math.cos(angle) * typeRadius;
                    const y = Math.sin(angle) * typeRadius;
                    graph.setNodeAttribute(node, 'x', x);
                    graph.setNodeAttribute(node, 'y', y);
                });

                ringIndex++;
            });

            if (renderer) renderer.refresh();
            console.log('Circular layout applied successfully');
        }

        function applyEnhancedForceLayout() {
            showLoadingOverlay('Force Directed Layout', 'Computing optimal positions...');
            layoutRunning = true;

            const nodes = graph.nodes();
            const edges = graph.edges();
            const nodeCount = nodes.length;
            const edgeCount = edges.length;

            // Adaptive parameters based on graph size - optimized for maximum dispersion
            const totalIterations = Math.min(800, Math.max(50, Math.ceil(nodeCount / 1.5)));
            const optimalDistance = Math.max(800, Math.min(2000, Math.sqrt(nodeCount) * 50)); // Much larger optimal distance for 5000+ nodes
            const canvasSize = Math.max(2000, nodeCount * 80); // Much larger canvas for 5000+ nodes
            const repulsionStrength = Math.max(15.0, 25.0 - (nodeCount / 200)); // Much stronger repulsion for large graphs

            // Initialize positions if not set
            nodes.forEach(node => {
                if (!graph.hasNodeAttribute(node, 'x')) {
                    graph.setNodeAttribute(node, 'x', (Math.random() - 0.5) * canvasSize);
                }
                if (!graph.hasNodeAttribute(node, 'y')) {
                    graph.setNodeAttribute(node, 'y', (Math.random() - 0.5) * canvasSize);
                }
            });

            let currentIteration = 0;
            let temperature = 1.0;

            function processIteration() {
                if (currentIteration >= totalIterations || !layoutRunning) {
                    layoutRunning = false;
                    hideLoadingOverlay();
                    if (renderer) renderer.refresh();
                    console.log('Enhanced Force Directed layout completed successfully');
                    return;
                }

                // Update progress
                const progress = (currentIteration / totalIterations) * 100;
                updateProgress(progress, `Iteration ${currentIteration}/${totalIterations}`);

                // Cool down temperature
                temperature = 1.0 - (currentIteration / totalIterations);
                const forces = {};

                // Initialize forces
                nodes.forEach(node => {
                    forces[node] = { x: 0, y: 0 };
                });

                                // Enhanced repulsion forces for maximum dispersion
                const maxRepulsionDistance = optimalDistance * 8; // Much larger range for 5000+ nodes
                nodes.forEach((node1, i) => {
                    const pos1 = {
                        x: graph.getNodeAttribute(node1, 'x'),
                        y: graph.getNodeAttribute(node1, 'y')
                    };

                    nodes.slice(i + 1).forEach(node2 => {
                        const pos2 = {
                            x: graph.getNodeAttribute(node2, 'x'),
                            y: graph.getNodeAttribute(node2, 'y')
                        };

                        const dx = pos1.x - pos2.x;
                        const dy = pos1.y - pos2.y;
                        const distance = Math.max(Math.sqrt(dx * dx + dy * dy), 1);

                        // Skip if too far away
                        if (distance > maxRepulsionDistance) return;

                        // Much stronger repulsion with exponential falloff for maximum dispersion
                        const normalizedDistance = Math.max(distance / optimalDistance, 0.1);
                        const repulsionForce = (repulsionStrength * optimalDistance * 3.0) / (normalizedDistance * normalizedDistance);
                        const force = Math.min(repulsionForce, optimalDistance * 2.5);

                        forces[node1].x += (dx / distance) * force;
                        forces[node1].y += (dy / distance) * force;
                        forces[node2].x -= (dx / distance) * force;
                        forces[node2].y -= (dy / distance) * force;
                    });
                });

                                // Enhanced spring forces along edges for better structure
                edges.forEach(edge => {
                    const [source, target] = graph.extremities(edge);
                    const pos1 = {
                        x: graph.getNodeAttribute(source, 'x'),
                        y: graph.getNodeAttribute(source, 'y')
                    };
                    const pos2 = {
                        x: graph.getNodeAttribute(target, 'x'),
                        y: graph.getNodeAttribute(target, 'y')
                    };

                    const dx = pos2.x - pos1.x;
                    const dy = pos2.y - pos1.y;
                    const distance = Math.max(Math.sqrt(dx * dx + dy * dy), 1);

                    // Adaptive spring force - stronger when far from optimal distance
                    const distanceRatio = distance / optimalDistance;
                    let springStrength = 0.15; // Base strength

                    if (distanceRatio > 2.0) {
                        // Too far - stronger attraction
                        springStrength = 0.3 * Math.min(distanceRatio, 3.0);
                    } else if (distanceRatio < 0.7) {
                        // Too close - much weaker attraction to allow more dispersion
                        springStrength = 0.02;
                    }

                    const springForce = (distance - optimalDistance) * springStrength;

                    forces[source].x += (dx / distance) * springForce;
                    forces[source].y += (dy / distance) * springForce;
                    forces[target].x -= (dx / distance) * springForce;
                    forces[target].y -= (dy / distance) * springForce;
                });

                // Apply forces with temperature-based damping - allow larger movements for large graphs
                const dampening = 0.25 * temperature + 0.05;
                const maxMove = optimalDistance * temperature * 1.2;

                nodes.forEach(node => {
                    const currentX = graph.getNodeAttribute(node, 'x');
                    const currentY = graph.getNodeAttribute(node, 'y');

                    // Limit force magnitude
                    const forceMagnitude = Math.sqrt(forces[node].x * forces[node].x + forces[node].y * forces[node].y);
                    if (forceMagnitude > maxMove) {
                        forces[node].x = (forces[node].x / forceMagnitude) * maxMove;
                        forces[node].y = (forces[node].y / forceMagnitude) * maxMove;
                    }

                    graph.setNodeAttribute(node, 'x', currentX + forces[node].x * dampening);
                    graph.setNodeAttribute(node, 'y', currentY + forces[node].y * dampening);
                });

                currentIteration++;

                // Refresh every few iterations to show progress
                if (currentIteration % 2 === 0 && renderer) {
                    renderer.refresh();
                }

                // Schedule next iteration
                currentLayoutAnimation = requestAnimationFrame(processIteration);
            }

            processIteration();
        }

        // Keep old function for compatibility
        function applySimpleForceLayout() {
            showLoadingOverlay('Simple Force Layout', 'Computing positions...');
            layoutRunning = true;

            const nodes = graph.nodes();
            const edges = graph.edges();
            const totalIterations = Math.min(40, Math.max(20, Math.ceil(nodes.length / 5))); // Adaptive iterations

            // Initialize random positions if not set
            nodes.forEach(node => {
                if (!graph.hasNodeAttribute(node, 'x')) {
                    graph.setNodeAttribute(node, 'x', (Math.random() - 0.5) * 800);
                }
                if (!graph.hasNodeAttribute(node, 'y')) {
                    graph.setNodeAttribute(node, 'y', (Math.random() - 0.5) * 800);
                }
            });

            let currentIteration = 0;

            function processIteration() {
                if (currentIteration >= totalIterations || !layoutRunning) {
                    layoutRunning = false;
                    hideLoadingOverlay();
                    if (renderer) renderer.refresh();
                    console.log('Simple force layout completed successfully');
                    return;
                }

                // Update progress
                const progress = (currentIteration / totalIterations) * 100;
                updateProgress(progress, `Iteration ${currentIteration}/${totalIterations}`);

                const forces = {};
                const repulsionStrength = Math.max(5000, 10000 / Math.sqrt(nodes.length)); // Adaptive repulsion

                // Initialize forces
                nodes.forEach(node => {
                    forces[node] = { x: 0, y: 0 };
                });

                // Repulsion between all nodes (optimized)
                nodes.forEach((node1, i) => {
                    nodes.slice(i + 1).forEach(node2 => {
                        const pos1 = {
                            x: graph.getNodeAttribute(node1, 'x'),
                            y: graph.getNodeAttribute(node1, 'y')
                        };
                        const pos2 = {
                            x: graph.getNodeAttribute(node2, 'x'),
                            y: graph.getNodeAttribute(node2, 'y')
                        };

                        const dx = pos1.x - pos2.x;
                        const dy = pos1.y - pos2.y;
                        const distance = Math.max(Math.sqrt(dx * dx + dy * dy), 1);
                        const force = repulsionStrength / (distance * distance);

                        forces[node1].x += (dx / distance) * force;
                        forces[node1].y += (dy / distance) * force;
                        forces[node2].x -= (dx / distance) * force;
                        forces[node2].y -= (dy / distance) * force;
                    });
                });

                // Attraction along edges
                edges.forEach(edge => {
                    const [source, target] = graph.extremities(edge);
                    const pos1 = {
                        x: graph.getNodeAttribute(source, 'x'),
                        y: graph.getNodeAttribute(source, 'y')
                    };
                    const pos2 = {
                        x: graph.getNodeAttribute(target, 'x'),
                        y: graph.getNodeAttribute(target, 'y')
                    };

                    const dx = pos2.x - pos1.x;
                    const dy = pos2.y - pos1.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const force = distance * 0.008;

                    forces[source].x += (dx / distance) * force;
                    forces[source].y += (dy / distance) * force;
                    forces[target].x -= (dx / distance) * force;
                    forces[target].y -= (dy / distance) * force;
                });

                // Apply forces with adaptive damping
                const dampening = Math.max(0.6, 0.9 - (currentIteration / totalIterations) * 0.3);
                nodes.forEach(node => {
                    const currentX = graph.getNodeAttribute(node, 'x');
                    const currentY = graph.getNodeAttribute(node, 'y');

                    graph.setNodeAttribute(node, 'x', currentX + forces[node].x * dampening);
                    graph.setNodeAttribute(node, 'y', currentY + forces[node].y * dampening);
                });

                currentIteration++;

                // Refresh every few iterations to show progress
                if (currentIteration % 3 === 0 && renderer) {
                    renderer.refresh();
                }

                // Schedule next iteration
                currentLayoutAnimation = requestAnimationFrame(processIteration);
            }

            processIteration();
        }

        function stopLayout() {
            if (layoutWorker) {
                layoutWorker.kill();
                layoutWorker = null;
            }
            if (currentLayoutAnimation) {
                cancelAnimationFrame(currentLayoutAnimation);
                currentLayoutAnimation = null;
            }
            layoutRunning = false;
            hideLoadingOverlay();
            console.log('Layout stopped');
        }

        // Store original node and edge styles for hover functionality
        let hoveredNode = null;
        let originalNodeStyles = {};
        let originalEdgeStyles = {};

        function setupEventListeners() {
            // Node hover events with highlighting
            renderer.on('enterNode', (event) => {
                const nodeId = event.node;
                const node = graph.getNodeAttributes(nodeId);

                // Update info panel
                const nodeInfo = document.getElementById('node-info');
                nodeInfo.innerHTML = `
                    <strong>${node.label}</strong><br>
                    Type: ${node.kind}<br>
                    ${node.entity ? `Entity: ${node.entity}<br>` : ''}
                    ID: ${nodeId}
                `;

                // Apply hover highlighting
                applyHoverHighlight(nodeId);
            });

            renderer.on('leaveNode', () => {
                document.getElementById('node-info').innerHTML = 'Hover over a node to see details';

                // Remove hover highlighting
                removeHoverHighlight();
            });

            // Click events
            renderer.on('clickNode', (event) => {
                console.log('Clicked node:', event.node, graph.getNodeAttributes(event.node));
            });
        }

        function applyHoverHighlight(hoveredNodeId) {
            if (hoveredNode === hoveredNodeId) return; // Already highlighted

            // Clear previous highlight
            removeHoverHighlight();

            hoveredNode = hoveredNodeId;

            // Get connected nodes and edges
            const connectedNodes = new Set([hoveredNodeId]);
            const connectedEdges = new Set();

            // Find all neighbors and connecting edges
            graph.forEachEdge(hoveredNodeId, (edge, attributes, source, target) => {
                connectedEdges.add(edge);
                connectedNodes.add(source === hoveredNodeId ? target : source);
            });

            // Store original styles and apply new ones
            graph.forEachNode((nodeId, attributes) => {
                originalNodeStyles[nodeId] = {
                    color: attributes.color,
                    size: attributes.size
                };

                if (connectedNodes.has(nodeId)) {
                    // Highlight connected nodes
                    if (nodeId === hoveredNodeId) {
                        // Main hovered node - make it bigger and brighter
                        graph.setNodeAttribute(nodeId, 'color', '#ff6b35');
                        graph.setNodeAttribute(nodeId, 'size', attributes.size * 2.5);
                    } else {
                        // Connected neighbors - slight highlight
                        graph.setNodeAttribute(nodeId, 'color', '#ffab00');
                        graph.setNodeAttribute(nodeId, 'size', attributes.size * 1.8);
                    }
                } else {
                    // Dim non-connected nodes
                    graph.setNodeAttribute(nodeId, 'color', '#cccccc');
                    graph.setNodeAttribute(nodeId, 'size', attributes.size * 0.4);
                }
            });

            // Handle edge highlighting
            graph.forEachEdge((edgeId, attributes) => {
                originalEdgeStyles[edgeId] = {
                    color: attributes.color,
                    size: attributes.size
                };

                if (connectedEdges.has(edgeId)) {
                    // Highlight connected edges
                    graph.setEdgeAttribute(edgeId, 'color', '#ff6b35');
                    graph.setEdgeAttribute(edgeId, 'size', Math.max(attributes.size * 3, 2));
                } else {
                    // Dim non-connected edges
                    graph.setEdgeAttribute(edgeId, 'color', '#e0e0e0');
                    graph.setEdgeAttribute(edgeId, 'size', attributes.size * 0.3);
                }
            });

            // Refresh the renderer to show changes
            if (renderer) renderer.refresh();
        }

        function removeHoverHighlight() {
            if (!hoveredNode) return;

            // Restore original node styles
            Object.keys(originalNodeStyles).forEach(nodeId => {
                const original = originalNodeStyles[nodeId];
                graph.setNodeAttribute(nodeId, 'color', original.color);
                graph.setNodeAttribute(nodeId, 'size', original.size);
            });

            // Restore original edge styles
            Object.keys(originalEdgeStyles).forEach(edgeId => {
                const original = originalEdgeStyles[edgeId];
                graph.setEdgeAttribute(edgeId, 'color', original.color);
                graph.setEdgeAttribute(edgeId, 'size', original.size);
            });

            // Clear stored styles
            originalNodeStyles = {};
            originalEdgeStyles = {};
            hoveredNode = null;

            // Refresh the renderer to show changes
            if (renderer) renderer.refresh();
        }

        function resetCamera() {
            if (renderer) {
                renderer.getCamera().animate({
                    x: 0,
                    y: 0,
                    ratio: 1
                }, {
                    duration: 500
                });
            }
        }



        function filterByType(type) {
            if (!graph || !renderer) return;

            graph.forEachNode((node, attributes) => {
                if (attributes.kind === type) {
                    graph.setNodeAttribute(node, 'hidden', false);
                } else {
                    graph.setNodeAttribute(node, 'hidden', true);
                }
            });

            renderer.refresh();
        }

        function showAll() {
            if (!graph || !renderer) return;

            graph.forEachNode((node) => {
                graph.setNodeAttribute(node, 'hidden', false);
            });

            renderer.refresh();
        }

        // Loading overlay management functions
        function showLoadingOverlay(title = 'Processing...', status = 'Please wait...') {
            const overlay = document.getElementById('loading-overlay');
            const titleElement = document.getElementById('loading-title');
            const statusElement = document.getElementById('loading-status');
            const progressFill = document.getElementById('progress-fill');

            if (overlay && titleElement && statusElement && progressFill) {
                titleElement.textContent = title;
                statusElement.textContent = status;
                progressFill.style.width = '0%';
                overlay.style.display = 'flex';
            }
        }

        function hideLoadingOverlay() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }

        function updateProgress(percentage, status = '') {
            const progressFill = document.getElementById('progress-fill');
            const statusElement = document.getElementById('loading-status');

            if (progressFill) {
                progressFill.style.width = Math.min(100, Math.max(0, percentage)) + '%';
            }

            if (status && statusElement) {
                statusElement.textContent = status;
            }
        }

        // Wait for all libraries to load, then initialize the graph
        function initializeWhenReady() {
            const requiredLibs = [
                { name: 'graphology', check: () => typeof graphology !== 'undefined' },
                { name: 'Sigma', check: () => typeof Sigma !== 'undefined' }
            ];

            const optionalLibs = [
                { name: 'ForceAtlas2', check: () => typeof graphologyLayoutForceAtlas2 !== 'undefined' },
                { name: 'Force Layout', check: () => typeof graphologyLayoutForce !== 'undefined' }
            ];

            const requiredLoaded = requiredLibs.every(lib => lib.check());

            if (requiredLoaded) {
                console.log('Required libraries loaded, initializing graph...');

                // Log optional library status and show/hide buttons accordingly
                optionalLibs.forEach(lib => {
                    const available = lib.check();
                    console.log(`${lib.name}: ${available ? 'Available' : 'Not available'}`);

                    if (lib.name === 'ForceAtlas2' && available) {
                        const btn = document.getElementById('forceatlas2-btn');
                        if (btn) btn.style.display = 'inline-block';
                    }
                });

                loadGraph();
            } else {
                const missing = requiredLibs.filter(lib => !lib.check()).map(lib => lib.name);
                console.log(`Waiting for libraries to load... Missing: ${missing.join(', ')}`);
                setTimeout(initializeWhenReady, 100);
            }
        }

        // Load the graph when the page loads
        window.addEventListener('load', () => {
            setTimeout(initializeWhenReady, 100); // Small delay to ensure scripts are fully loaded
        });
    </script>
</body>
